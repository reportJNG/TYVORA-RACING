<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TYPERACE // 3D Velocity Typing Engine</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Instant Theme Bootstrap (Prevents Theme Flash) -->
    <script>
      try {
        const raw = localStorage.getItem('typerace_settings');
        if (raw) {
          const parsed = JSON.parse(raw);
          const theme = parsed.state?.theme || parsed.theme;
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (theme === 'system') {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-accent selection:text-accent-contrast">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
